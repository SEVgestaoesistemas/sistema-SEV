<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Configurar administração · SEV Gestão &amp; Sistemas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="login-page"><main class="login-layout"><section class="login-card" aria-labelledby="bootstrapTitle"><img class="login-logo" src="assets/sev-logo.jpeg" alt="SEV Gestão &amp; Sistemas"><div class="login-heading"><p class="eyebrow">Configuração inicial</p><h1 id="bootstrapTitle">Administrador da plataforma</h1><p>Use esta tela uma única vez, com o e-mail de uma conta já existente e o código secreto definido no Render.</p></div><form class="login-form password-change-form" id="bootstrapForm"><label class="field"><span>E-mail da sua conta</span><input name="email" type="email" autocomplete="email" maxlength="160" required></label><label class="field"><span>Código secreto de inicialização</span><input name="token" type="password" autocomplete="off" minlength="24" maxlength="256" required></label><p class="login-status" id="bootstrapStatus" role="status" aria-live="polite"></p><button class="primary-button" type="submit" data-label="Configurar administrador">Configurar administrador</button></form></section></main><script src="api.js"></script><script src="bootstrap-platform.js"></script></body></html>

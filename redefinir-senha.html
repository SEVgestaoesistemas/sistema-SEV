<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Redefinir senha · SEV Gestão &amp; Sistemas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="login-page"><main class="login-layout"><section class="login-card" aria-labelledby="resetTitle"><img class="login-logo" src="assets/sev-logo.jpeg" alt="SEV Gestão &amp; Sistemas"><div class="login-heading"><p class="eyebrow">Recuperação segura</p><h1 id="resetTitle">Defina uma nova senha</h1><p>Escolha uma senha pessoal. Este link é válido por tempo limitado e só pode ser usado uma vez.</p></div><form class="login-form password-change-form" id="passwordResetForm"><label class="field"><span>Nova senha</span><input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><small>Use ao menos 12 caracteres, incluindo letra maiúscula, minúscula e número.</small><label class="field"><span>Confirmar nova senha</span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p class="login-status" id="passwordResetStatus" role="status" aria-live="polite"></p><button class="primary-button" type="submit" data-label="Salvar nova senha">Salvar nova senha</button><p class="login-assistance"><a href="login.html">Voltar para entrar</a></p></form></section></main><script src="api.js"></script><script src="password-reset.js"></script></body></html>

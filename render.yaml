services:
  - type: web
    name: sev-api
    runtime: node
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: FRONTEND_ORIGIN
        value: https://sevgestaoesistemas.github.io
      - key: FRONTEND_URL
        value: https://sevgestaoesistemas.github.io/sistema-SEV/
      - key: SESSION_TTL_DAYS
        value: "7"
      - key: SESSION_SAME_SITE
        value: none
      # Limite de tentativas de login por IP para contas de clientes.
      - key: LOGIN_RATE_LIMIT_MAX
        value: "5"
      - key: LOGIN_RATE_LIMIT_WINDOW
        value: "15 minutes"
      # Limites da API de integraÃ§Ã£o por empresa (memÃ³ria por minuto e banco por dia).
      - key: INTEGRATION_API_RATE_LIMIT_MAX
        value: "30"
      - key: INTEGRATION_API_DAILY_LIMIT
        value: "2000"
      # Canal de recuperaÃ§Ã£o manual exibido na tela de login. Informe somente DDI + nÃºmero.
      - key: ADMIN_WHATSAPP_NUMBER
        sync: false
      # Segredo do Gemini: cadastre o valor apenas no painel do Render.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SUPPORT_CHAT_USER_DAILY_LIMIT
        value: "15"
      - key: SUPPORT_CHAT_ORGANIZATION_DAILY_LIMIT
        value: "60"
      - key: PUBLIC_REGISTRATION_ENABLED
        value: "false"
      # Segredo usado uma única vez para definir o administrador da plataforma.
      - key: PLATFORM_BOOTSTRAP_TOKEN
        sync: false
      # Segredo compartilhado com o Worker Cloudflare para assinar o IP real do visitante.
      - key: WORKER_IP_SIGNATURE_SECRET
        sync: false
      # Exceção temporária de teste de carga: somente GET /api/v1/health e IP exato.
      # Cadastre ambos os valores no painel do Render e remova-os após o teste.
      - key: LOAD_TEST_HEALTH_ALLOWED_IP
        sync: false
      - key: LOAD_TEST_HEALTH_BYPASS_EXPIRES_AT
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        sync: false

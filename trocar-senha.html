<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Trocar senha · SEV Gestão &amp; Sistemas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="login-page"><main class="login-layout"><section class="login-card" aria-labelledby="passwordChangeTitle"><img class="login-logo" src="assets/sev-logo.jpeg" alt="SEV Gestão &amp; Sistemas"><div class="login-heading"><p class="eyebrow">Primeiro acesso</p><h1 id="passwordChangeTitle">Defina sua nova senha</h1><p>Para proteger a conta da sua empresa, escolha uma senha pessoal antes de continuar.</p></div><form class="login-form password-change-form" id="passwordChangeForm"><label class="field"><span>Senha temporária</span><input name="currentPassword" type="password" autocomplete="current-password" maxlength="128" required></label><label class="field"><span>Nova senha</span><input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><small>Use ao menos 12 caracteres, incluindo letra maiúscula, minúscula e número.</small><label class="field"><span>Confirmar nova senha</span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p class="login-status" id="passwordChangeStatus" role="status" aria-live="polite"></p><button class="primary-button" type="submit" data-label="Salvar nova senha">Salvar nova senha</button></form></section></main><script src="api.js"></script><script src="password-change.js"></script></body></html>
